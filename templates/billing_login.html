<!DOCTYPE html>
<html>
<head>
    <title>DHL Express – Billing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --dhl-red: #D40511; }
        body { background: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .card { border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); max-width: 440px; width: 100%; border: none; }
        .card-header { background: linear-gradient(135deg, var(--dhl-red) 0%, #b0040e 100%); color: white; border-radius: 20px 20px 0 0; padding: 1.5rem; text-align: center; }
        .card-header img { height: 50px; filter: brightness(0) invert(1); }
        .card-header h4 { margin-top: 0.5rem; font-weight: 700; }
        .btn-primary { background: var(--dhl-red); border-color: var(--dhl-red); border-radius: 30px; padding: 0.6rem 1.5rem; font-weight: 600; }
        .btn-primary:hover { background: #b0040e; border-color: #b0040e; }
        .form-control { border-radius: 12px; padding: 0.75rem 1rem; border-color: #d1d5db; }
        .form-control:focus { border-color: var(--dhl-red); box-shadow: 0 0 0 3px rgba(212,5,17,0.1); }
        @media (max-width: 480px) { .card { margin: 0; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="{{ url_for('static', filename='dhl-logo.png') }}" alt="DHL">
            <h4>Billing & Invoices</h4>
            <p class="mb-0" style="opacity:0.8;font-size:0.9rem;">Enter your email to view invoices</p>
        </div>
        <div class="card-body p-4">
            <form method="GET" action="{{ url_for('billing') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-2"></i>View Invoices</button>
            </form>
            <hr>
            <div class="text-center small text-muted">
                <a href="{{ url_for('index') }}" class="text-decoration-none">← Back to tracking</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
