<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHL Live Tracking{% if shipment %} – {{ shipment.tracking_number }}{% endif %}</title>

    <!-- Tailwind (minimal) + custom styles -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        /* ---- DHL variables & reset ---- */
        :root {
            --ink: #151a24;
            --navy: #1c2a4a;
            --amber: #e8a33d;
            --gray-600: #6b7280;
            --gray-400: #9aa3b0;
            --gray-300: #c7ccd4;
            --gray-200: #e6e9ee;
            --gray-100: #f4f5f7;
            --paper: #ffffff;
            --canvas: #eef0f3;
            --green: #1f9d55;
            --red: #d84a4a;
            --line: #e5e8ed;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-100);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            height: 100%;
        }

        .app {
            max-width: 1400px;
            margin: 20px auto;
            background: var(--paper);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(20,22,26,0.06), 0 12px 32px rgba(20,22,26,0.06);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        /* ---- Navbar ---- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
            gap: 12px;
        }
        .navbar .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--navy);
        }
        .navbar .brand .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--amber);
        }
        .navbar nav {
            display: flex;
            gap: 28px;
        }
        .navbar nav a {
            font-size: 13.5px;
            color: var(--gray-600);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar nav a:hover { color: var(--navy); }
        .navbar nav a.active {
            color: var(--ink);
            position: relative;
        }
        .navbar nav a.active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -19px;
            height: 2px;
            background: var(--navy);
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--gray-100);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12.5px;
            color: var(--gray-400);
            min-width: 200px;
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 12.5px;
            color: var(--ink);
            width: 100%;
        }
        .search-box input::placeholder { color: var(--gray-400); }
        .search-box svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        .track-btn {
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .track-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .track-btn:hover:not(:disabled) { opacity: 0.85; }

        /* ---- Body (sidebar + map) ---- */
        .body {
            display: flex;
            flex: 1;
            min-height: 600px;
        }

        /* ---- Sidebar ---- */
        .sidebar {
            width: 380px;
            flex-shrink: 0;
            padding: 24px 26px 22px;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--paper);
        }
        .back-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .back-row a {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink);
            text-decoration: none;
        }
        .back-row a:hover { color: var(--navy); }
        .back-row svg {
            width: 16px;
            height: 16px;
        }

        /* Connection / fetch state */
        .fetch-state {
            font-size: 12px;
            color: var(--gray-400);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fetch-state .led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gray-300);
            flex-shrink: 0;
        }
        .fetch-state.ok .led { background: var(--green); }
        .fetch-state.err .led { background: var(--red); }
        .fetch-state.loading .led {
            background: var(--amber);
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Meta grid */
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .meta-grid .label {
            font-size: 10.5px;
            color: var(--gray-400);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 5px;
        }
        .meta-grid .value {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            word-break: break-word;
        }
        .meta-grid .value.accent { color: var(--navy); }
        .meta-grid .value .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            background: var(--gray-200);
            color: var(--gray-600);
        }
        .meta-grid .value .status-badge.delivered {
            background: #dcfce7; color: #16a34a;
        }
        .meta-grid .value .status-badge.in-transit {
            background: #dbeafe; color: #1e40af;
        }
        .meta-grid .value .status-badge.out-for-delivery {
            background: #fef3c7; color: #92400e;
        }
        .meta-grid .value .status-badge.delayed {
            background: #fef3c7; color: #d97706;
        }
        .meta-grid .value .status-badge.exception {
            background: #fef2f2; color: #dc2626;
        }
        .meta-grid .value .status-badge.pending {
            background: #f3f4f6; color: #6b7280;
        }
        .meta-grid .value .status-badge.on-hold {
            background: #fef3c7; color: #b45309;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 26px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            min-height: 120px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: var(--gray-200);
        }
        .timeline .rail-fill {
            position: absolute;
            left: 5px;
            top: 6px;
            width: 2px;
            background: var(--navy);
            z-index: 1;
            transition: height 0.5s ease;
        }
        .step {
            position: relative;
            margin-bottom: 24px;
            border-radius: 10px;
            padding: 6px 8px;
            margin-left: -8px;
        }
        .step:last-child { margin-bottom: 0; }
        .step .dot {
            position: absolute;
            left: -18px;
            top: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--gray-300);
            z-index: 2;
            transition: border-color 0.3s, background 0.3s;
        }
        .step.done .dot { border-color: var(--navy); }
        .step.done .dot::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--navy);
        }
        .step.current .dot {
            border-color: var(--amber);
            box-shadow: 0 0 0 4px rgba(232,163,61,0.2);
        }
        .step.current .dot::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 50%;
            background: var(--amber);
        }
        .step.pending .dot { border-color: var(--gray-200); }
        .step .time {
            font-size: 11.5px;
            color: var(--gray-400);
            font-weight: 600;
            margin-bottom: 3px;
        }
        .step .title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 3px;
        }
        .step .loc {
            font-size: 12.5px;
            color: var(--gray-600);
        }
        .step .note {
            font-size: 11.5px;
            color: var(--red);
            font-weight: 700;
            margin-top: 5px;
        }

        .empty-state {
            font-size: 13px;
            color: var(--gray-400);
            padding: 20px 0;
        }

        /* Badges */
        .badges {
            margin-top: 16px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--gray-600);
            font-weight: 600;
            text-align: center;
            flex: 1 1 30%;
            min-width: 70px;
        }
        .badge svg {
            width: 20px;
            height: 20px;
            color: var(--navy);
        }

        /* ---- Map Pane ---- */
        .map-pane {
            position: relative;
            flex: 1;
            background: var(--canvas);
            min-height: 500px;
        }
        #map {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
        }
        .map-tag {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 6px;
            border-radius: 4px;
            height: 34px;
            background: var(--navy);
            z-index: 500;
        }

        /* Fullscreen map */
        .map-pane.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            padding: 0;
            border-radius: 0;
            margin: 0;
        }
        .map-pane.fullscreen #map { height: 100vh; }

        /* Custom markers */
        .stop-marker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }
        .stop-marker.done { background: var(--navy); }
        .stop-marker.current { background: var(--amber); }
        .stop-marker.pending { background: #3a3f47; }
        .truck-marker {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--amber);
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .truck-marker svg {
            width: 13px;
            height: 13px;
            color: #1c1c1c;
        }

        .leaflet-popup-content-wrapper { border-radius: 10px; }
        .leaflet-popup-content {
            font-family: inherit;
            font-size: 12.5px;
            margin: 10px 12px;
        }
        .leaflet-control-custom {
            background: white;
            border: 2px solid rgba(0,0,0,0.12);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
            transition: all 0.2s ease;
            margin: 4px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .leaflet-control-custom:hover:not(:disabled) {
            background: #f5f5f5;
            border-color: var(--navy);
        }
        .leaflet-control-custom:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .leaflet-control-custom.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }
        .leaflet-control-custom.active:hover { background: #15203a; }

        /* ---- Footer ---- */
        .footer {
            background: var(--navy);
            color: #c7ccd4;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer a {
            color: #c7ccd4;
            text-decoration: none;
            margin-right: 22px;
            transition: color 0.2s;
        }
        .footer a:hover { color: #fff; }

        /* ---- Responsive ---- */
        @media (max-width: 820px) {
            .body { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--line);
                max-height: 500px;
            }
            .map-pane { height: 400px; min-height: 300px; }
            .navbar nav { display: none; }
            .search-box { min-width: 120px; }
            .meta-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 600px) {
            .sidebar { padding: 16px 18px; }
            .meta-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .meta-grid .value { font-size: 12px; }
            .step .title { font-size: 12.5px; }
            .step .loc { font-size: 11.5px; }
            .badge { font-size: 10px; min-width: 60px; }
            .badge svg { width: 18px; height: 18px; }
            .map-pane { height: 320px; min-height: 250px; }
            .navbar { padding: 10px 16px; }
            .search-box { min-width: 100px; padding: 6px 10px; }
            .track-btn { padding: 6px 14px; font-size: 12px; }
        }

        @media (max-width: 480px) {
            .navbar { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .track-btn { width: 100%; }
            .sidebar { padding: 12px 14px; max-height: 400px; }
            .meta-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .meta-grid .label { font-size: 9px; }
            .meta-grid .value { font-size: 11px; }
            .timeline { padding-left: 20px; }
            .step { padding: 4px 6px; margin-bottom: 18px; }
            .step .dot { width: 10px; height: 10px; left: -15px; top: 6px; }
            .step .time { font-size: 10px; }
            .step .title { font-size: 12px; }
            .step .loc { font-size: 11px; }
            .badge { font-size: 9px; min-width: 50px; }
            .badge svg { width: 16px; height: 16px; }
            .map-pane { height: 260px; min-height: 200px; }
            .footer { font-size: 11px; padding: 10px 16px; flex-direction: column; align-items: center; gap: 6px; }
            .footer a { margin-right: 12px; }
        }

        @media (max-width: 380px) {
            .sidebar { padding: 10px 12px; max-height: 350px; }
            .meta-grid { grid-template-columns: 1fr; }
            .map-pane { height: 200px; min-height: 180px; }
            .step .title { font-size: 11px; }
            .step .loc { font-size: 10px; }
            .badges { flex-direction: column; align-items: stretch; gap: 6px; }
            .badge { flex-direction: row; justify-content: center; gap: 6px; width: 100%; font-size: 10px; }
            .badge svg { width: 14px; height: 14px; }
            .navbar .brand { font-size: 13px; }
            .search-box input { font-size: 11px; }
            .track-btn { font-size: 11px; padding: 6px 10px; }
        }

        /* ---- Toast ---- */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            padding: 14px 18px;
            border-radius: 10px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-weight: 500;
            animation: slideInToast 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #1a1a1a;
        }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }
        .toast.info { background: #2563eb; }
        .toast .close-toast {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.7;
        }
        .toast .close-toast:hover { opacity: 1; }
        @keyframes slideInToast {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ---- Spinner (legacy) ---- */
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 4px solid rgba(28,42,74,0.15);
            border-top-color: var(--navy);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Scrollbar ---- */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
    </style>

    <!-- Socket.IO + Leaflet JS -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"
            integrity="sha384-2iD2sSxOOsF8bh3X9bLlTGNlbWtQhJcHhPcZ+VAoZkC3XxgdRCpM9vB2M/6OVPr"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>
</head>
<body>

<div class="app">

    <!-- ===== NAVBAR ===== -->
    <div class="navbar">
        <div class="brand">
            <span class="dot"></span>
            <span>DHL Track</span>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="#" class="active">Tracking</a>
            <a href="#">Support</a>
        </nav>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M21 21l-4.35-4.35" />
                </svg>
                <input id="trackingInput" placeholder="Track another shipment" value="{% if shipment %}{{ shipment.tracking_number }}{% endif %}">
            </div>
            <button class="track-btn" id="trackBtn">Track</button>
        </div>
    </div>

    <!-- ===== BODY ===== -->
    <div class="body">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">

            <!-- Back / home link -->
            <div class="back-row">
                <a href="{{ url_for('index') }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6" /></svg>
                    Shipment Details
                </a>
            </div>

            <!-- Connection status -->
            <div class="fetch-state" id="fetchState">
                <span class="led" id="fetchLed"></span>
                <span id="fetchStateLabel">Loading…</span>
            </div>

            <!-- Meta grid -->
            <div class="meta-grid">
                <div>
                    <div class="label">Tracking ID</div>
                    <div class="value" id="metaTrackingId">—</div>
                </div>
                <div>
                    <div class="label">Status</div>
                    <div class="value" id="metaStatus">—</div>
                </div>
                <div>
                    <div class="label">Est. Arrival</div>
                    <div class="value accent" id="metaEta">—</div>
                </div>
            </div>

            <!-- Timeline -->
            <div class="timeline" id="timeline">
                <div class="empty-state">Loading checkpoint data…</div>
            </div>

            <!-- Badges -->
            <div class="badges" id="badges">
                <div class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" /></svg>
                    <span id="badgeService">Service</span>
                </div>
                <div class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z" /></svg>
                    <span id="badgeCarrier">Carrier</span>
                </div>
                <div class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
                    <span id="badgeMode">Mode</span>
                </div>
            </div>

            <!-- Hidden legacy elements (kept for compatibility) -->
            <div style="display:none;" id="legacyDetails">
                <span id="status"></span>
                <span id="progressPercent"></span>
                <span id="progressFill"></span>
                <span id="currentLocation"></span>
                <span id="currentCoordinates"></span>
                <span id="positionStatusText"></span>
                <span id="estimatedArrival"></span>
                <span id="lastCheckpoint"></span>
                <span id="nextCheckpoint"></span>
                <span id="deliveryLocation"></span>
                <span id="serviceLevel"></span>
                <span id="deliveryWindow"></span>
                <span id="proofOfDelivery"></span>
                <span id="lastUpdated"></span>
                <span id="trackingNumberDisplay"></span>
                <span id="liveIndicator"></span>
                <span id="liveIndicatorLabel"></span>
                <span id="connectionDot"></span>
                <span id="connectionStatus"></span>
                <span id="refreshHint"></span>
                <span id="retryBtn"></span>
                <span id="modeBadge"></span>
                <span id="speedBadge"></span>
                <span id="pausedBanner"></span>
            </div>

        </div>

        <!-- MAP PANE -->
        <div class="map-pane" id="mapContainer">
            <div class="map-tag"></div>
            <div id="map"></div>
        </div>

    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <div>
            <a href="#">Help</a>
            <a href="#">FAQ</a>
            <a href="#">Contact</a>
        </div>
        <div>&copy; 2026 DHL International</div>
    </div>

</div>

<!-- ===== TOAST CONTAINER ===== -->
<div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

<!-- ============================================================ -->
<!--  SCRIPTS – full tracking logic                               -->
<!-- ============================================================ -->
<script>
    // --------------------------------------------------------------
    //  GLOBALS & HELPERS
    // --------------------------------------------------------------
    const SOCKET_URL = window.location.origin;
    const REFRESH_INTERVAL_MS = 30000;
    const MARKER_TWEEN_MS = 900;
    const DEBUG = true;   // set to false in production

    function debugLog(...args) { if (DEBUG) console.log(...args); }

    function sanitizeArray(arr) { return Array.isArray(arr) ? arr : []; }

    function toNum(v) {
        if (v === null || v === undefined) return null;
        const n = parseFloat(v);
        return isNaN(n) ? null : n;
    }

    function fmtDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Status badge CSS class mapping
    function statusBadgeClass(status) {
        const map = {
            'Delivered': 'delivered',
            'In_Transit': 'in-transit',
            'Out_for_Delivery': 'out-for-delivery',
            'Delayed': 'delayed',
            'Exception': 'exception',
            'On_Hold': 'on-hold'
        };
        return map[status] || 'pending';
    }

    // --------------------------------------------------------------
    //  TOAST
    // --------------------------------------------------------------
    function showToast(message, type = 'info', duration = 5000) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.setAttribute('role', 'alert');
        toast.innerHTML = `
            <span>${message}</span>
            <button class="close-toast" aria-label="Dismiss notification">&times;</button>
        `;
        container.appendChild(toast);
        const closeBtn = toast.querySelector('.close-toast');
        closeBtn.addEventListener('click', () => toast.remove());
        setTimeout(() => { if (toast.parentNode) toast.remove(); }, duration);
    }

    // --------------------------------------------------------------
    //  SOCKET.IO SETUP
    // --------------------------------------------------------------
    const socket = io(SOCKET_URL, {
        transports: ['polling', 'websocket'],
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000,
        auth: {}
    });

    let trackingInterval = null;

    function updateConnectionStatus(connected) {
        const dot = document.getElementById('fetchLed');
        const label = document.getElementById('fetchStateLabel');
        const stateEl = document.getElementById('fetchState');
        if (dot) dot.className = 'led';
        if (stateEl) {
            stateEl.className = `fetch-state ${connected ? 'ok' : 'err'}`;
        }
        if (label) label.textContent = connected ? 'Connected' : 'Disconnected';
    }

    socket.on('connect', () => {
        debugLog('Socket.IO connected');
        updateConnectionStatus(true);
        requestTracking();
        if (trackingInterval) clearInterval(trackingInterval);
        trackingInterval = setInterval(() => {
            if (socket.connected) requestTracking();
        }, REFRESH_INTERVAL_MS);
    });

    socket.on('disconnect', () => {
        debugLog('Socket.IO disconnected');
        updateConnectionStatus(false);
        if (trackingInterval) {
            clearInterval(trackingInterval);
            trackingInterval = null;
        }
    });

    socket.on('connect_error', (err) => {
        console.error('Socket.IO connection error:', err);
        updateConnectionStatus(false);
        showToast('Connection error – retrying…', 'error', 4000);
    });

    // --------------------------------------------------------------
    //  TRACKING REQUEST
    // --------------------------------------------------------------
    const trackingNumber = "{{ shipment.tracking_number if shipment else '' }}";

    function requestTracking() {
        if (!trackingNumber) { debugLog('No tracking number – skipping'); return; }
        debugLog('Requesting tracking update');
        socket.emit('request_tracking', { tracking_number: trackingNumber });
    }

    // Track another shipment via input
    document.getElementById('trackBtn').addEventListener('click', () => {
        const id = document.getElementById('trackingInput').value.trim();
        if (id) window.location.href = `/track/${id}`;
    });
    document.getElementById('trackingInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const id = e.target.value.trim();
            if (id) window.location.href = `/track/${id}`;
        }
    });

    // --------------------------------------------------------------
    //  MAP INITIALIZATION
    // --------------------------------------------------------------
    let map = null;
    let markerGroup, polylineGroup, liveMarkerGroup;
    let routeBounds = null;
    let smoothMotionEnabled = true;

    function initMap() {
        try {
            if (typeof L === 'undefined') {
                console.warn('Leaflet library not loaded – map will not be available');
                return;
            }
            const container = document.getElementById('map');
            if (!container) { console.error('Map container missing'); return; }

            map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markerGroup = L.layerGroup().addTo(map);
            polylineGroup = L.layerGroup().addTo(map);
            liveMarkerGroup = L.layerGroup().addTo(map);

            // Custom controls
            const SmoothMotionControl = L.Control.extend({
                options: { position: 'topright' },
                onAdd: function() {
                    const container = L.DomUtil.create('button', 'leaflet-control-custom');
                    container.id = 'toggleSmoothMotion';
                    container.innerHTML = '▶ Smooth';
                    container.classList.add('active');
                    container.setAttribute('aria-label', 'Toggle smooth marker movement');
                    container.setAttribute('role', 'switch');
                    container.setAttribute('aria-checked', 'true');
                    container.onclick = function() {
                        smoothMotionEnabled = !smoothMotionEnabled;
                        container.classList.toggle('active');
                        container.innerHTML = smoothMotionEnabled ? '▶ Smooth' : '⏸ Instant';
                        container.setAttribute('aria-checked', smoothMotionEnabled ? 'true' : 'false');
                    };
                    return container;
                }
            });

            const ResetViewControl = L.Control.extend({
                options: { position: 'topright' },
                onAdd: function() {
                    const container = L.DomUtil.create('button', 'leaflet-control-custom');
                    container.id = 'resetView';
                    container.innerHTML = '⊞ Reset';
                    container.setAttribute('aria-label', 'Reset map view');
                    container.disabled = true;
                    container.onclick = function() {
                        if (routeBounds) map.fitBounds(routeBounds, { padding: [20, 20] });
                        else if (window._lastMarkerLatLng) map.setView(window._lastMarkerLatLng, 6);
                    };
                    return container;
                }
            });

            const FullscreenControl = L.Control.extend({
                options: { position: 'topright' },
                onAdd: function() {
                    const container = L.DomUtil.create('button', 'leaflet-control-custom');
                    container.id = 'fullscreenBtn';
                    container.innerHTML = '⛶ Full';
                    container.setAttribute('aria-label', 'Toggle fullscreen map');
                    container.onclick = function() {
                        const mapContainer = document.getElementById('mapContainer');
                        if (!mapContainer) return;
                        mapContainer.classList.toggle('fullscreen');
                        setTimeout(() => map.invalidateSize(), 100);
                        container.innerHTML = mapContainer.classList.contains('fullscreen') ? '⛶ Exit' : '⛶ Full';
                    };
                    return container;
                }
            });

            map.addControl(new SmoothMotionControl());
            map.addControl(new ResetViewControl());
            map.addControl(new FullscreenControl());

            debugLog('Map initialized');

            // Process any pending route/marker
            if (window._pendingRoute) {
                maybeRedrawRoute(window._pendingRoute);
                window._pendingRoute = null;
            }
            if (window._pendingMarker) {
                moveLiveMarker(window._pendingMarker.lat, window._pendingMarker.lon, window._pendingMarker.label, true);
                window._pendingMarker = null;
            }
        } catch (e) {
            console.error('Map init error:', e);
        }
    }

    // --------------------------------------------------------------
    //  ROUTE DRAWING
    // --------------------------------------------------------------
    function routeSignature(coords) {
        if (!coords || !coords.length) return '';
        const first = coords[0];
        const last = coords[coords.length - 1];
        return `${coords.length}:${first.lat},${first.lon}:${last.lat},${last.lon}`;
    }

    function maybeRedrawRoute(coords) {
        if (!map) { window._pendingRoute = coords; return; }
        if (!coords || !coords.length) {
            document.getElementById('resetView')?.setAttribute('disabled', 'true');
            return;
        }

        const sig = routeSignature(coords);
        if (sig === window._routeSignature) return;
        window._routeSignature = sig;

        markerGroup.clearLayers();
        polylineGroup.clearLayers();

        // Draw checkpoint markers (only those with description)
        coords.forEach(c => {
            if (c.desc) {
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="stop-marker done"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                L.marker([c.lat, c.lon], { icon })
                    .bindPopup(c.desc)
                    .addTo(markerGroup);
            }
        });

        const latlngs = coords.map(c => [c.lat, c.lon]);
        L.polyline(latlngs, {
            color: '#1c2a4a',
            weight: 4,
            lineCap: 'round',
            opacity: 0.6
        }).addTo(polylineGroup);

        routeBounds = L.latLngBounds(latlngs);
        map.fitBounds(routeBounds, { padding: [20, 20] });
        document.getElementById('resetView')?.removeAttribute('disabled');
        debugLog('Route redrawn');
    }

    // --------------------------------------------------------------
    //  LIVE MARKER MOVEMENT
    // --------------------------------------------------------------
    let markerTweenFrame = null;

    function buildTruckIcon() {
        return L.divIcon({
            className: '',
            html: `<div class="truck-marker"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2l1-5h9l3 5h3v5h-2a2 2 0 11-4 0H9a2 2 0 11-4 0H3v-5z"/></svg></div>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });
    }

    function moveLiveMarker(lat, lon, label, skipTween) {
        if (lat === null || lon === null) return;
        if (!map || !liveMarkerGroup) {
            window._pendingMarker = { lat, lon, label };
            return;
        }

        const newLatLng = L.latLng(lat, lon);

        if (!window._liveMarker) {
            const icon = buildTruckIcon();
            window._liveMarker = L.marker(newLatLng, { icon, zIndexOffset: 1000 }).addTo(liveMarkerGroup);
            window._livePulse = L.circle(newLatLng, {
                color: '#e8a33d',
                fillColor: '#e8a33d',
                fillOpacity: 0.12,
                radius: 1200,
                interactive: false
            }).addTo(liveMarkerGroup);
            window._liveMarker.bindPopup(`<b>Current location</b><br>${label || 'Live position'}`);
            window._lastMarkerLatLng = newLatLng;
            if (!routeBounds) map.setView(newLatLng, 6);
            return;
        }

        window._liveMarker.setPopupContent(`<b>Current location</b><br>${label || 'Live position'}`);

        if (markerTweenFrame) {
            cancelAnimationFrame(markerTweenFrame);
            markerTweenFrame = null;
        }

        if (skipTween || !smoothMotionEnabled) {
            window._liveMarker.setLatLng(newLatLng);
            window._livePulse.setLatLng(newLatLng);
            window._lastMarkerLatLng = newLatLng;
            return;
        }

        const startLatLng = window._lastMarkerLatLng || newLatLng;
        const startTime = performance.now();

        function step(now) {
            const t = Math.min((now - startTime) / MARKER_TWEEN_MS, 1);
            const curLat = startLatLng.lat + (newLatLng.lat - startLatLng.lat) * t;
            const curLon = startLatLng.lng + (newLatLng.lng - startLatLng.lng) * t;
            const curLatLng = L.latLng(curLat, curLon);
            window._liveMarker.setLatLng(curLatLng);
            window._livePulse.setLatLng(curLatLng);
            if (t < 1) {
                markerTweenFrame = requestAnimationFrame(step);
            } else {
                window._lastMarkerLatLng = newLatLng;
                markerTweenFrame = null;
            }
        }
        markerTweenFrame = requestAnimationFrame(step);
    }

    // --------------------------------------------------------------
    //  SIDEBAR RENDER (timeline + meta)
    // --------------------------------------------------------------
    function renderSidebar(data) {
        // Meta
        document.getElementById('metaTrackingId').textContent = data.tracking_number || '—';

        // Status with badge
        const statusEl = document.getElementById('metaStatus');
        const statusText = data.status || '—';
        const cls = statusBadgeClass(statusText);
        statusEl.innerHTML = `<span class="status-badge ${cls}">${statusText}</span>`;

        document.getElementById('metaEta').textContent = data.delivery_window || '—';

        // Badges
        document.getElementById('badgeService').textContent = data.service_level || 'DHL Express';
        document.getElementById('badgeCarrier').textContent = data.carrier || 'DHL';
        const mode = data.mode || 'ground';
        document.getElementById('badgeMode').textContent = mode === 'air' ? '✈️ Air' : '🚚 Ground';

        // Timeline
        const timelineEl = document.getElementById('timeline');
        timelineEl.innerHTML = '';

        const checkpoints = sanitizeArray(data.checkpoints || []);
        if (!checkpoints.length) {
            timelineEl.innerHTML = '<div class="empty-state">No checkpoints available yet.</div>';
            return;
        }

        // Rail fill
        const rail = document.createElement('div');
        rail.className = 'rail-fill';
        const progress = toNum(data.progress) || 0;
        const total = checkpoints.length;
        const doneIndex = Math.round(progress * (total - 1));
        const doneCount = doneIndex + 1;
        rail.style.height = total > 1 ? `${(doneCount - 1) / (total - 1) * 100}%` : '0%';
        timelineEl.appendChild(rail);

        // Steps
        checkpoints.forEach((cp, idx) => {
            const parts = cp.split(' - ');
            const time = parts[0] || '';
            const location = parts[1] || '';
            const event = parts.slice(2).join(' - ') || cp;

            let stepStatus = 'pending';
            if (idx < doneIndex) stepStatus = 'done';
            else if (idx === doneIndex) stepStatus = 'current';

            const div = document.createElement('div');
            div.className = `step ${stepStatus}`;
            div.innerHTML = `
                <div class="dot"></div>
                <div class="time">${time || 'Pending'}</div>
                <div class="title">${event}</div>
                <div class="loc">${location}</div>
            `;
            timelineEl.appendChild(div);
        });
    }

    // --------------------------------------------------------------
    //  UNIFIED UPDATE HANDLER
    // --------------------------------------------------------------
    function applyTrackingUpdate(data) {
        if (!data) return;

        // Update sidebar
        renderSidebar(data);

        // Update map
        const lat = toNum(data.current_lat);
        const lon = toNum(data.current_lon);
        if (lat !== null && lon !== null) {
            moveLiveMarker(lat, lon, data.current_location || 'Current location');
        }

        // Route data
        const routeData = (data.route_coords && data.route_coords.length) ? data.route_coords : data.coords;
        if (routeData && routeData.length) {
            maybeRedrawRoute(routeData);
        }

        // Connection status
        updateConnectionStatus(true);

        // Update legacy elements (for compatibility with any lingering code)
        if (data.status) {
            const el = document.getElementById('status');
            if (el) el.textContent = data.status;
        }
        if (data.progress !== undefined) {
            const p = toNum(data.progress) || 0;
            const percent = Math.round(p * 100);
            const pEl = document.getElementById('progressPercent');
            const fEl = document.getElementById('progressFill');
            if (pEl) pEl.textContent = `${percent}%`;
            if (fEl) fEl.style.width = `${percent}%`;
        }
        if (data.current_location) {
            const el = document.getElementById('currentLocation');
            if (el) el.textContent = data.current_location;
        }
        if (lat !== null && lon !== null) {
            const el = document.getElementById('currentCoordinates');
            if (el) el.textContent = `${lat}, ${lon}`;
            const st = document.getElementById('positionStatusText');
            if (st) st.textContent = data.paused ? 'Paused' : 'Moving now';
        }
        if (data.delivery_window) {
            const el = document.getElementById('estimatedArrival');
            if (el) el.textContent = data.delivery_window;
            const el2 = document.getElementById('deliveryWindow');
            if (el2) el2.textContent = data.delivery_window;
        }
        if (data.checkpoints && data.checkpoints.length) {
            const cp = data.checkpoints;
            const lastEl = document.getElementById('lastCheckpoint');
            if (lastEl) lastEl.textContent = cp[cp.length - 1];
            if (cp.length > 1) {
                const nextEl = document.getElementById('nextCheckpoint');
                if (nextEl) {
                    const progress = toNum(data.progress) || 0;
                    const idx = Math.min(Math.max(1, Math.round(progress * (cp.length - 1))), cp.length - 1);
                    nextEl.textContent = cp[idx];
                }
            }
        }
        if (data.delivery_location) {
            const el = document.getElementById('deliveryLocation');
            if (el) el.textContent = data.delivery_location;
        }
        if (data.service_level) {
            const el = document.getElementById('serviceLevel');
            if (el) el.textContent = data.service_level;
        }
        if (data.proof_of_delivery) {
            const el = document.getElementById('proofOfDelivery');
            if (el) el.textContent = data.proof_of_delivery;
        }
        if (data.last_updated) {
            const el = document.getElementById('lastUpdated');
            if (el) el.textContent = `Last updated: ${fmtDate(data.last_updated)}`;
        }
        if (data.tracking_number) {
            const el = document.getElementById('trackingNumberDisplay');
            if (el) el.textContent = data.tracking_number;
        }
        if (data.paused !== undefined) {
            const dot = document.getElementById('liveIndicator');
            const label = document.getElementById('liveIndicatorLabel');
            if (dot) dot.classList.toggle('paused-dot', !!data.paused);
            if (label) label.textContent = data.paused ? 'Paused' : 'Live';
            const banner = document.getElementById('pausedBanner');
            if (banner) banner.classList.toggle('show', !!data.paused);
        }
        if (data.speed_multiplier !== undefined) {
            const badge = document.getElementById('speedBadge');
            if (badge) {
                const n = toNum(data.speed_multiplier);
                if (n !== null) {
                    badge.textContent = `⚡ ${n.toFixed(1)}× speed`;
                    badge.classList.add('show');
                }
            }
        }
        if (data.mode) {
            const badge = document.getElementById('modeBadge');
            if (badge) {
                const isAir = String(data.mode).toLowerCase() === 'air';
                badge.textContent = isAir ? '✈️ Air' : '🚚 Ground';
                badge.classList.add('show');
            }
        }
    }

    // --------------------------------------------------------------
    //  INITIAL DATA LOAD (server-rendered)
    // --------------------------------------------------------------
    function setInitialPageState() {
        try {
            const initialData = {
                tracking_number: "{{ shipment.tracking_number }}",
                status: "{{ shipment.status }}",
                progress: {{ progress | default(0) }},
                current_lat: {{ current_lat | default('null') }},
                current_lon: {{ current_lon | default('null') }},
                current_location: "{{ current_location | default('Calculating...') }}",
                delivery_window: "{{ delivery_window | default('Calculating...') }}",
                delivery_location: "{{ shipment.delivery_location }}",
                service_level: "{{ service_level | default('DHL Express') }}",
                proof_of_delivery: "{{ proof_of_delivery | default('Pending') }}",
                checkpoints: sanitizeArray({{ checkpoints | tojson }}),
                carrier: "{{ shipment.carrier or 'DHL' }}",
                mode: "{{ transport_mode | default('ground') }}",
                last_updated: "{{ shipment.last_updated.isoformat() if shipment.last_updated else '' }}"
            };

            applyTrackingUpdate(initialData);

            // If we have route coords but map not initialized, store for later
            const coords = sanitizeArray({{ coords | tojson }});
            const routeCoords = sanitizeArray({{ route_coords | tojson }});
            const mapCoords = routeCoords.length ? routeCoords : coords;
            if (mapCoords.length) {
                setTimeout(() => maybeRedrawRoute(mapCoords), 500);
            }
        } catch (e) {
            console.error('Error in setInitialPageState:', e);
        }
    }

    // --------------------------------------------------------------
    //  START
    // --------------------------------------------------------------
    // Initialize map
    initMap();

    // Load initial data
    setInitialPageState();

    // Listen for live updates
    socket.on('tracking_update', (data) => {
        debugLog('Received tracking update:', data);
        if (data.error) {
            showToast(data.error, 'error', 5000);
            return;
        }
        applyTrackingUpdate(data);
    });

    // Connection status initial
    updateConnectionStatus(socket.connected);
    if (!socket.connected) {
        showToast('Connecting to live server…', 'info', 3000);
    }

    debugLog('DHL tracking page loaded');
</script>

</body>
